# PMS local/self-hosted stack: Express backend + nginx-served React build.
#
#   docker compose up --build
#     frontend -> http://localhost:3000
#     backend  -> http://localhost:3001  (matches the non-Docker default in
#                 react-app/src/constant.js and `catalyst serve`)
#
# Catalyst Functions (functions/) are NOT part of this stack — they are
# serverless targets deployed with `catalyst deploy --only functions` and have
# no container form. See docs/DOCKER.md.

services:
  backend:
    build:
      # Context is the repo root — the CLI needs catalyst.json and .catalystrc.
      context: .
      dockerfile: appsail-nodejs/Dockerfile.cli
    image: pms-backend:local
    container_name: pms-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:9000"
    volumes:
      # Reuses the host's existing `catalyst login`. The CLI inside the
      # container injects the x-zc-* headers and refreshes the credential
      # itself, so no project key or access token is needed.
      # Only the credential FILE is mounted, so the container's own CLI
      # settings never touch the host's config directory.
      - "${CATALYST_CLI_CONFIG:-${APPDATA}/zcatalyst-cli-nodejs/Config/zcatalyst-cli.json}:/root/.config/zcatalyst-cli-nodejs/zcatalyst-cli.json"
    environment:
      X_ZOHO_CATALYST_LISTEN_PORT: "9000"

  frontend:
    build:
      context: ./react-app
      args:
        # Same-origin path; nginx proxies it to the backend service.
        REACT_APP_API_BASE_URL: "${REACT_APP_API_BASE_URL:-/api}"
    image: pms-frontend:local
    container_name: pms-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # Default: the backend container. Override to
      # http://host.docker.internal:3001 to proxy to a host-side
      # `catalyst serve` instead, which needs no credentials.
      API_UPSTREAM: "${API_UPSTREAM:-http://backend:9000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
